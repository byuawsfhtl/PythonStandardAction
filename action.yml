name: "Python Standard Checker"
description: "Checks Python files for code standards"
runs:
  using: "composite"
  steps:
    - name: Checkout code
      uses: actions/checkout@v4
     
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
     
    - name: Install dependencies from requirements.txt
      shell: bash
      run: pip install -r "${{ github.action_path }}/requirements.txt"

    - name: Get any missing type stubs for MyPy check
      shell: bash
      run: mypy --install-types --non-interactive
     
    - name: Run Standard Check
      shell: bash
      run: python "${{ github.action_path }}/StandardCheck.py"

    - name: Run mypy check with args
      shell: bash
      run: